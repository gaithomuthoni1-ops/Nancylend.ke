<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>NancyLend.KE – Loan Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:#e5e5e5;font-family:'DM Mono','Courier New',monospace;min-height:100vh;padding-bottom:60px}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
  input,select,textarea{background:#111;color:#e5e5e5;border:1px solid #2a2a2a;border-radius:8px;padding:11px 13px;font-family:'DM Mono',monospace;font-size:14px;width:100%;outline:none;transition:border .2s;-webkit-appearance:none}
  input:focus,select:focus{border-color:#f59e0b}
  input[type=date]{color-scheme:dark}
  input::placeholder{color:#555}
  button{cursor:pointer;font-family:'DM Mono',monospace;transition:all .15s}
  .header{background:linear-gradient(135deg,#111 0%,#0a0a0a 100%);border-bottom:1px solid #1a1a1a;padding:24px 16px 18px}
  .header-top{display:flex;justify-content:space-between;align-items:flex-start}
  .logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#f59e0b;letter-spacing:-.02em}
  .logo-sub{font-size:11px;color:#555;margin-top:2px}
  .btn-add{background:#f59e0b;color:#000;border:none;border-radius:8px;padding:11px 18px;font-weight:500;font-size:13px;letter-spacing:.03em;white-space:nowrap}
  .btn-add:active{background:#d97706}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
  .stat{background:#0f0f0f;border:1px solid #1e1e1e;border-radius:10px;padding:11px 12px}
  .stat-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  .stat-value{font-size:13px;font-weight:500}
  .filters{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .filter-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .filter-tabs::-webkit-scrollbar{display:none}
  .tab{background:transparent;border:1px solid #2a2a2a;color:#777;border-radius:20px;padding:6px 14px;font-size:12px;white-space:nowrap;text-transform:capitalize}
  .tab.active{border-color:#f59e0b;color:#f59e0b}
  .loans{padding:0 16px}
  .loan-card{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .loan-card.paid{opacity:.55}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .borrower-name{font-size:15px;font-weight:500;color:#e5e5e5}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:500;letter-spacing:.05em}
  .tag-active{color:#22c55e;background:#052e16}
  .tag-overdue{color:#ef4444;background:#2d0a0a}
  .tag-paid{color:#a3a3a3;background:#1a1a1a}
  .days-left{font-size:11px;color:#555}
  .note{font-size:11px;color:#555;margin-top:4px}
  .loan-details{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}
  .detail-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
  .detail-value{font-size:13px}
  .card-actions{display:flex;gap:6px;flex-shrink:0}
  .btn-edit{background:transparent;border:1px solid #2a2a2a;color:#999;border-radius:6px;padding:6px 10px;font-size:11px}
  .btn-edit:active{border-color:#555;color:#e5e5e5}
  .btn-paid{background:#052e16;color:#22c55e;border:1px solid #166534;border-radius:6px;padding:6px 10px;font-size:11px}
  .btn-paid:active{background:#166534}
  .btn-del{background:transparent;color:#555;border:1px solid #2a2a2a;border-radius:6px;padding:6px 9px;font-size:12px}
  .btn-del:active{color:#ef4444;border-color:#ef4444}
  .empty{text-align:center;color:#444;padding:60px 0;font-size:14px}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
  .modal{background:#111;border:1px solid #2a2a2a;border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
  .modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:#f59e0b;margin-bottom:20px}
  .field{margin-bottom:14px}
  label{display:block;font-size:11px;color:#777;margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .preview{background:#0f0f0f;border:1px solid #1e1e1e;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:13px}
  .preview span{color:#22c55e;font-weight:500}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .btn-cancel{background:transparent;border:1px solid #2a2a2a;color:#999;border-radius:8px;padding:10px 18px;font-size:13px}
  .btn-save{background:#f59e0b;color:#000;border:none;border-radius:8px;padding:10px 22px;font-weight:500;font-size:13px}
  .btn-save:active{background:#d97706}
  /* Confirm modal */
  .confirm-modal{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:28px 24px;width:90%;max-width:300px;text-align:center}
  .confirm-icon{font-size:34px;margin-bottom:10px}
  .confirm-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#e5e5e5;margin-bottom:6px}
  .confirm-sub{font-size:13px;color:#666;margin-bottom:22px}
  .confirm-actions{display:flex;gap:10px;justify-content:center}
  .btn-confirm{background:#22c55e;color:#000;border:none;border-radius:8px;padding:10px 22px;font-weight:500}
  select option{background:#111;color:#e5e5e5}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">NancyLend.KE</div>
      <div class="logo-sub">Loan Management Tracker</div>
    </div>
    <button class="btn-add" onclick="openAdd()">+ New Loan</button>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Capital Out</div>
      <div class="stat-value" id="stat-out" style="color:#f59e0b">KES 0</div>
    </div>
    <div class="stat">
      <div class="stat-label">To Recover</div>
      <div class="stat-value" id="stat-return" style="color:#22c55e">KES 0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Overdue</div>
      <div class="stat-value" id="stat-overdue" style="color:#ef4444">0 loans</div>
    </div>
  </div>
</div>

<div class="filters">
  <input id="search" type="text" placeholder="Search borrower name..." oninput="render()"/>
  <div class="filter-tabs">
    <button class="tab active" data-f="all" onclick="setFilter('all')">All</button>
    <button class="tab" data-f="active" onclick="setFilter('active')">Active</button>
    <button class="tab" data-f="overdue" onclick="setFilter('overdue')">Overdue</button>
    <button class="tab" data-f="paid" onclick="setFilter('paid')">Paid</button>
  </div>
</div>

<div class="loans" id="loan-list"></div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="form-modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">New Loan</div>
    <div class="field"><label>Borrower Name</label><input id="f-name" type="text" placeholder="Full name"/></div>
    <div class="row2">
      <div class="field"><label>Amount (KES)</label><input id="f-amount" type="number" placeholder="0" oninput="updatePreview()"/></div>
      <div class="field"><label>Interest (%)</label><input id="f-interest" type="number" placeholder="e.g. 10" oninput="updatePreview()"/></div>
    </div>
    <div class="field"><label>Return Date</label><input id="f-date" type="date"/></div>
    <div class="field"><label>Note (optional)</label><input id="f-note" type="text" placeholder="Purpose, collateral, etc."/></div>
    <div class="preview" id="preview" style="display:none">Total to recover: <span id="preview-val"></span></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveLoan()" id="save-btn">Add Loan</button>
    </div>
  </div>
</div>

<!-- Confirm Paid Modal -->
<div class="modal-bg" id="confirm-modal" style="display:none;align-items:center" onclick="closeConfirm()">
  <div class="confirm-modal" onclick="event.stopPropagation()">
    <div class="confirm-icon">✅</div>
    <div class="confirm-title">Mark as Paid?</div>
    <div class="confirm-sub">This will mark the loan as fully repaid.</div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-confirm" onclick="confirmPaid()">Confirm</button>
    </div>
  </div>
</div>

<script>
let loans = JSON.parse(localStorage.getItem('nancylendke_loans') || '[]');
let nextId = parseInt(localStorage.getItem('nancylendke_nextid') || '1');
let currentFilter = 'all';
let editId = null;
let pendingPaidId = null;

function save() {
  localStorage.setItem('nancylendke_loans', JSON.stringify(loans));
  localStorage.setItem('nancylendke_nextid', nextId);
}

function today() { return new Date().toISOString().split('T')[0]; }

function getStatus(loan) {
  if (loan.paid) return 'paid';
  if (loan.returnDate < today()) return 'overdue';
  return 'active';
}

function daysLeft(loan) {
  return Math.ceil((new Date(loan.returnDate) - new Date(today())) / 86400000);
}

function fmtKES(n) {
  return 'KES ' + Number(n).toLocaleString('en-KE', { minimumFractionDigits: 2 });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.f === f));
  render();
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const filtered = loans.filter(l => {
    const ms = l.name.toLowerCase().includes(search);
    const status = getStatus(l);
    return ms && (currentFilter === 'all' || status === currentFilter);
  });

  // Stats
  const active = loans.filter(l => !l.paid);
  const totalOut = active.reduce((s, l) => s + Number(l.amount), 0);
  const totalReturn = active.reduce((s, l) => s + Number(l.amount) * (1 + Number(l.interest) / 100), 0);
  const overdue = loans.filter(l => getStatus(l) === 'overdue').length;
  document.getElementById('stat-out').textContent = fmtKES(totalOut);
  document.getElementById('stat-return').textContent = fmtKES(totalReturn);
  document.getElementById('stat-overdue').textContent = overdue + ' loan' + (overdue !== 1 ? 's' : '');

  const list = document.getElementById('loan-list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">' + (search ? 'No borrowers found.' : 'No loans yet. Tap + New Loan to start.') + '</div>';
    return;
  }

  list.innerHTML = filtered.map(loan => {
    const status = getStatus(loan);
    const returnAmt = Number(loan.amount) * (1 + Number(loan.interest) / 100);
    const days = daysLeft(loan);
    const tagHtml = status === 'active'
      ? `<span class="tag tag-active">Active</span><span class="days-left">${days}d left</span>`
      : status === 'overdue'
      ? `<span class="tag tag-overdue">Overdue</span><span class="tag tag-overdue">${Math.abs(days)}d overdue</span>`
      : `<span class="tag tag-paid">Paid</span>`;

    const actionHtml = loan.paid
      ? `<button class="btn-del" onclick="deleteLoan(${loan.id})">✕</button>`
      : `<button class="btn-edit" onclick="openEdit(${loan.id})">Edit</button>
         <button class="btn-paid" onclick="askPaid(${loan.id})">✓ Paid</button>
         <button class="btn-del" onclick="deleteLoan(${loan.id})">✕</button>`;

    return `
      <div class="loan-card ${loan.paid ? 'paid' : ''}">
        <div class="card-top">
          <div style="flex:1">
            <div class="borrower-name">${loan.name}</div>
            <div class="tags">${tagHtml}</div>
            ${loan.note ? `<div class="note">${loan.note}</div>` : ''}
          </div>
          <div class="card-actions">${actionHtml}</div>
        </div>
        <div class="loan-details">
          <div>
            <div class="detail-label">Principal</div>
            <div class="detail-value" style="color:#e5e5e5">${fmtKES(loan.amount)}</div>
          </div>
          <div>
            <div class="detail-label">Interest</div>
            <div class="detail-value" style="color:#f59e0b">${loan.interest}%</div>
          </div>
          <div>
            <div class="detail-label">Return</div>
            <div class="detail-value" style="color:#22c55e">${fmtKES(returnAmt)}</div>
          </div>
          <div>
            <div class="detail-label">Due</div>
            <div class="detail-value" style="color:${status === 'overdue' ? '#ef4444' : '#e5e5e5'}">${loan.returnDate}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function openAdd() {
  editId = null;
  document.getElementById('modal-title').textContent = 'New Loan';
  document.getElementById('save-btn').textContent = 'Add Loan';
  document.getElementById('f-name').value = '';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-interest').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('preview').style.display = 'none';
  document.getElementById('form-modal').style.display = 'flex';
}

function openEdit(id) {
  const loan = loans.find(l => l.id === id);
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit Loan';
  document.getElementById('save-btn').textContent = 'Save Changes';
  document.getElementById('f-name').value = loan.name;
  document.getElementById('f-amount').value = loan.amount;
  document.getElementById('f-interest').value = loan.interest;
  document.getElementById('f-date').value = loan.returnDate;
  document.getElementById('f-note').value = loan.note || '';
  updatePreview();
  document.getElementById('form-modal').style.display = 'flex';
}

function closeModal() { document.getElementById('form-modal').style.display = 'none'; }

function updatePreview() {
  const a = parseFloat(document.getElementById('f-amount').value);
  const i = parseFloat(document.getElementById('f-interest').value);
  const prev = document.getElementById('preview');
  if (a && i) {
    document.getElementById('preview-val').textContent = fmtKES(a * (1 + i / 100));
    prev.style.display = 'block';
  } else {
    prev.style.display = 'none';
  }
}

function saveLoan() {
  const name = document.getElementById('f-name').value.trim();
  const amount = document.getElementById('f-amount').value;
  const interest = document.getElementById('f-interest').value;
  const returnDate = document.getElementById('f-date').value;
  const note = document.getElementById('f-note').value.trim();
  if (!name || !amount || !interest || !returnDate) { alert('Please fill in all required fields.'); return; }
  if (editId) {
    loans = loans.map(l => l.id === editId ? { ...l, name, amount: Number(amount), interest: Number(interest), returnDate, note } : l);
  } else {
    loans.push({ id: nextId++, name, amount: Number(amount), interest: Number(interest), returnDate, note, paid: false });
  }
  save(); closeModal(); render();
}

function askPaid(id) {
  pendingPaidId = id;
  const cm = document.getElementById('confirm-modal');
  cm.style.display = 'flex';
}

function closeConfirm() { document.getElementById('confirm-modal').style.display = 'none'; pendingPaidId = null; }

function confirmPaid() {
  loans = loans.map(l => l.id === pendingPaidId ? { ...l, paid: true } : l);
  save(); closeConfirm(); render();
}

function deleteLoan(id) {
  if (!confirm('Delete this loan record?')) return;
  loans = loans.filter(l => l.id !== id);
  save(); render();
}

render();
</script>
</body>
</html>
